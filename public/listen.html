<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Звук ПК" />
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Sound Stream — Слушать</title>
<style>
  /* Плоская тёмная тема в духе iOS: чистый чёрный фон, системная палитра,
     без градиентов, без рамок и «карточки» — одно целостное полотно. */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1c1c1e;      /* inset-группа, как в Настройках iOS */
    --track: #39393d;
    --text: #ffffff;
    --secondary: rgba(235, 235, 245, .6);
    --tertiary: rgba(235, 235, 245, .3);
    --green: #30d158;
    --red: #ff453a;
  }
  * { box-sizing: border-box; }
  /* Экран приложения, а не документ: скролла нет вообще (никакой резинки на iOS),
     двойной тап не зумит (touch-action: manipulation). */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
  }
  .page {
    height: 100%; overflow: hidden;
    max-width: 420px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(24px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom));
  }

  /* --- шапка: обложка, название, статус --- */
  .top { display: flex; flex-direction: column; align-items: center; margin-top: min(6vh, 40px); flex: none; }
  /* Обложка — та же иконка, что у приложения на экране «Домой». */
  .art {
    width: 96px; height: 96px; border-radius: 22px;
    background: var(--surface); display: block;
    -webkit-user-drag: none; user-select: none;
  }

  h1 { margin: 20px 0 0; font-size: 24px; font-weight: 650; letter-spacing: .2px; }
  .status {
    margin: 8px 0 0; display: flex; align-items: center; gap: 8px;
    font-size: 15px; color: var(--secondary);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #636366; flex: none; }
  .dot.live { background: var(--green); animation: pulse 2s infinite; }
  .dot.err { background: var(--red); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, .45); }
    70% { box-shadow: 0 0 0 7px rgba(48, 209, 88, 0); }
    100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
  }

  /* --- центр: живой эквалайзер (реальный спектр) и кнопка play/pause --- */
  /* min-height: 0 — чтобы центр сжимался на низких экранах и страница
     всегда помещалась целиком (скролла-то нет). */
  .stage {
    flex: 1; min-height: 0; width: 100%;
    margin-top: clamp(20px, 7vh, 72px);  /* воздух между шапкой и эквалайзером */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
  }
  .viz { width: 100%; max-width: 360px; height: clamp(80px, 24vh, 200px); min-height: 0; }
  .viz canvas { width: 100%; height: 100%; display: block; }
  .play {
    border: 0; background: none; padding: 18px; cursor: pointer; color: var(--text);
    transition: transform .18s ease, opacity .18s ease;
  }
  .play svg { width: 72px; height: 72px; fill: currentColor; display: block; }
  .play .i-play { transform: translateX(4px); }  /* оптическое центрирование треугольника */
  .play .i-pause { display: none; }
  .play.playing .i-play { display: none; }
  .play.playing .i-pause { display: block; }
  .play:active { transform: scale(.88); }
  .play:disabled { opacity: .25; cursor: default; }

  /* --- низ: задержка, inset-группа с буфером, подсказка --- */
  .bottom { width: 100%; flex: none; }
  .lat {
    text-align: center; font-size: 13px; color: var(--tertiary);
    margin-bottom: 14px; font-variant-numeric: tabular-nums;
  }
  .cell {
    background: var(--surface); border-radius: 14px; padding: 14px 16px 12px;
  }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .lbl { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--secondary); }
  .val { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .scale { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--tertiary); }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 28px;
    background: transparent; cursor: pointer; --p: 0%;
    touch-action: none;  /* палец на ползунке тянет ползунок, а не страницу */
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(#fff, #fff) no-repeat, var(--track); /* плоская белая заливка */
    background-size: var(--p) 100%, 100% 100%;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 24px; height: 24px; margin-top: -10px;
    border-radius: 50%; background: #fff; border: 0;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .45);
  }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--track); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: #fff; }
  input[type=range]::-moz-range-thumb {
    width: 24px; height: 24px; border: 0; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0, 0, 0, .45);
  }

  #sink { display: none; }

  /* Совсем низкие экраны: ужимаем шапку и кнопку, чтобы всё влезло без скролла
     и эквалайзеру осталось место. */
  @media (max-height: 620px) {
    .top { margin-top: 0; }
    .art { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin-top: 12px; font-size: 20px; }
    .stage { margin-top: 14px; }
    .play { padding: 10px; }
    .play svg { width: 56px; height: 56px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot.live { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="page">
    <header class="top">
      <img class="art" src="/icon-192.png" width="96" height="96" alt="" aria-hidden="true" />
      <h1>Звук с ПК</h1>
      <p class="status"><span id="dot" class="dot"></span><span id="statusText">Подключение…</span></p>
    </header>

    <div class="stage">
      <div class="viz" aria-hidden="true"><canvas id="viz"></canvas></div>
      <button id="play" class="play" disabled aria-label="Воспроизвести">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1.2"/>
          <rect x="14" y="5" width="4" height="14" rx="1.2"/>
        </svg>
      </button>
    </div>

    <!-- Скрытый <audio> — настоящая медиа-дорожка. Через него iOS продолжает
         играть звук в фоне и с выключенным экраном. -->
    <audio id="sink" playsinline></audio>

    <footer class="bottom">
      <div class="lat" id="lat">Задержка: — мс</div>

      <section class="cell">
        <div class="row">
          <span class="lbl">Буфер</span>
          <span id="bufVal" class="val">10 мс</span>
        </div>
        <input id="buf" type="range" min="10" max="200" step="5" value="10" />
        <div class="scale"><span>меньше задержка</span><span>стабильнее</span></div>
      </section>
    </footer>
  </main>

<script>
// --- Никакого скролла и зума: страница ведёт себя как экран приложения. ---
// Safari на iOS игнорирует user-scalable=no, поэтому глушим жесты руками:
// resize-жест (pinch), «резинку» при протяжке и зум по двойному тапу.
document.addEventListener('touchmove', (e) => {
  if (e.touches.length > 1) { e.preventDefault(); return; }        // pinch-zoom
  const t = e.target;
  if (!(t instanceof Element) || !t.closest('input[type=range]')) e.preventDefault();
}, { passive: false });
for (const t of ['gesturestart', 'gesturechange', 'gestureend']) {
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
}
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
// Старые Safari трактуют второй тап в пределах 350 мс как «зум» — съедаем его,
// но только вне кнопок и ползунка, чтобы не сломать быстрые нажатия play/pause.
let lastTap = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  const t = e.target;
  const control = t instanceof Element && t.closest('button, input');
  if (!control && now - lastTap < 350) e.preventDefault();
  lastTap = now;
}, { passive: false });

const playBtn = document.getElementById('play');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const audioEl = document.getElementById('sink');
const latEl = document.getElementById('lat');
const buf = document.getElementById('buf');
const bufVal = document.getElementById('bufVal');
const viz = document.getElementById('viz');
const vctx = viz.getContext('2d');

let ws = null;
let audioCtx = null;
let gainNode = null;
let streamDest = null;     // MediaStreamAudioDestinationNode -> <audio>
let streamLive = false;
let started = false;

let latencyMs = 0;         // сглаженная локальная задержка (буфер + выход)
let latTimer = null;       // таймер обновления индикатора

let sampleRate = 48000;   // обновляется из format-сообщения источника
let nextTime = 0;         // момент (в часах audioCtx) для следующего кусочка

const VIZ_BARS = 27;      // столбиков в эквалайзере
let analyser = null;      // AnalyserNode — реальный спектр играющего звука
let vizRaf = 0;           // id кадра requestAnimationFrame
let barMap = null;        // столбик -> диапазон FFT-бинов (лог-шкала)

// Целевой буфер вперёд живого края, мс. Меньше — ниже задержка, но при неровной
// сети возможны заикания. Из него выводим окно коррекции скоростью (hi/lo вокруг
// цели) и аварийный порог отставания (max — прыжок к живому краю).
function cfgFromBuf(ms) {
  const j = ms / 1000;
  return { jitter: j, hi: j * 0.9, lo: j * 0.5, max: j * 3 + 0.05 };
}
// Safari в приватном режиме бросает исключение на localStorage — оборачиваем.
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let bufMs = parseInt(lsGet('ss-buf'), 10);
if (!bufMs) {  // миграция со старых пресетов или значение по умолчанию
  const old = lsGet('ss-mode');
  bufMs = old === 'stable' ? 120 : old === 'balanced' ? 60 : 10;
}
bufMs = Math.min(200, Math.max(10, bufMs));
let cfg = cfgFromBuf(bufMs);

function setStatus(text, cls) {
  statusText.textContent = text;
  dot.className = 'dot' + (cls ? ' ' + cls : '');
}

function wsURL() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/?role=listener`;
}

function connect() {
  ws = new WebSocket(wsURL());
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => setStatus('Подключено. Ожидание эфира…');

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'format') sampleRate = msg.sampleRate || sampleRate;
        if (msg.type === 'live') { streamLive = true; onLive(); }
        if (msg.type === 'offline') { streamLive = false; onOffline(); }
      } catch {}
      return;
    }
    if (started && audioCtx) schedulePCM(ev.data);
  };

  ws.onclose = () => {
    setStatus('Соединение потеряно. Переподключение…', 'err');
    if (!started) playBtn.disabled = true;
    setTimeout(connect, 1500);
  };
  ws.onerror = () => setStatus('Ошибка соединения', 'err');
}

function onLive() {
  setStatus(started ? 'Воспроизведение' : 'Эфир идёт', 'live');
  if (!started) playBtn.disabled = false;
}

function onOffline() {
  setStatus('ПК не в эфире', 'err');
  if (!started) playBtn.disabled = true;
}

function startPlayback() {
  if (started) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 1;   // громкость регулируется кнопками телефона

  // Ключевой момент для фона/выключенного экрана на iOS:
  // не выводим звук напрямую в audioCtx.destination, а гоним его в MediaStream
  // и воспроизводим через обычный <audio>. Для системы это «медиа-дорожка»,
  // поэтому AudioContext не глушится в фоне и появляются контролы на локскрине.
  streamDest = audioCtx.createMediaStreamDestination();
  gainNode.connect(streamDest);
  audioEl.srcObject = streamDest.stream;

  // Живой эквалайзер: тот же сигнал заводим в анализатор спектра.
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.75;
  gainNode.connect(analyser);
  buildBarMap(audioCtx.sampleRate, analyser.frequencyBinCount);

  audioCtx.resume();           // обязательно по жесту пользователя (особенно iOS)
  const p = audioEl.play();    // тоже по жесту — иначе iOS не отдаст фон
  if (p && p.catch) p.catch(() => {});

  setupMediaSession();

  nextTime = 0;
  started = true;
  startLatencyReadout();
  startViz();
  playBtn.classList.add('playing');
  playBtn.setAttribute('aria-label', 'Остановить');
  setStatus(streamLive ? 'Воспроизведение' : 'Ожидание эфира…', streamLive ? 'live' : '');
}

// Периодически выводим сглаженную задержку в мс, пока идёт воспроизведение.
function startLatencyReadout() {
  latencyMs = 0;
  latEl.textContent = 'Задержка: измеряю…';
  clearInterval(latTimer);
  latTimer = setInterval(() => {
    if (started && latencyMs) latEl.textContent = 'Задержка: ~' + Math.round(latencyMs) + ' мс';
  }, 300);
}

function stopLatencyReadout() {
  clearInterval(latTimer);
  latTimer = null;
  latencyMs = 0;
  latEl.textContent = 'Задержка: — мс';
}

// Метаданные и контролы для экрана блокировки / шторки уведомлений.
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Звук ПК',
      artist: 'Sound Stream',
      artwork: [
        { src: '/icon-192.png', sizes: '192x192', type: 'image/png' },
        { src: '/icon-512.png', sizes: '512x512', type: 'image/png' }
      ]
    });
    navigator.mediaSession.playbackState = 'playing';
    navigator.mediaSession.setActionHandler('play', () => {
      if (!started) startPlayback();
      audioEl.play().catch(() => {});
      navigator.mediaSession.playbackState = 'playing';
    });
    navigator.mediaSession.setActionHandler('pause', stopPlayback);
    navigator.mediaSession.setActionHandler('stop', stopPlayback);
  } catch (e) {}
}

// Int16 PCM (моно) -> запланированное воспроизведение через Web Audio.
function schedulePCM(arrayBuffer) {
  const i16 = new Int16Array(arrayBuffer);
  const n = i16.length;
  if (n === 0) return;
  const buffer = audioCtx.createBuffer(1, n, sampleRate);
  const f32 = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) f32[i] = i16[i] / 0x8000;

  const now = audioCtx.currentTime;
  // Старт/недобор буфера или авария (слишком большое отставание) — задаём запас.
  if (nextTime < now + 0.005 || nextTime - now > cfg.max) nextTime = now + cfg.jitter;

  // Плавная коррекция задержки скоростью (±%, на слух почти незаметно):
  // отстаём от живого края — чуть ускоряемся, подобрались слишком близко — тормозим.
  const lead = nextTime - now;
  let rate = 1;
  if (lead > cfg.jitter + cfg.hi) rate = 1.02;
  else if (lead < cfg.jitter - cfg.lo) rate = 0.99;

  // Локальная задержка = буфер впереди живого края + задержка вывода устройства.
  // Сетевую часть (ПК→сервер→сюда) без синхронизации часов не измерить.
  const out = audioCtx.outputLatency || audioCtx.baseLatency || 0;
  const inst = (lead + out) * 1000;
  latencyMs = latencyMs ? latencyMs * 0.9 + inst * 0.1 : inst;

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.playbackRate.value = rate;
  src.connect(gainNode);
  src.start(nextTime);
  nextTime += buffer.duration / rate; // реальная длительность с учётом скорости
}

function stopPlayback() {
  started = false;
  stopLatencyReadout();
  playBtn.classList.remove('playing');
  playBtn.setAttribute('aria-label', 'Воспроизвести');
  if (audioEl) { audioEl.pause(); audioEl.srcObject = null; }
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null;
  gainNode = null;
  streamDest = null;
  cancelAnimationFrame(vizRaf);
  analyser = null;
  drawViz(null);  // вернуть «спящие» заглушки
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  setStatus(streamLive ? 'Эфир идёт' : 'ПК не в эфире', streamLive ? 'live' : 'err');
}

playBtn.addEventListener('click', () => {
  if (started) stopPlayback(); else startPlayback();
});

// Применяем целевой буфер на лету и запоминаем число.
function setBuf(ms, save) {
  bufMs = ms;
  cfg = cfgFromBuf(ms);
  bufVal.textContent = ms + ' мс';
  buf.value = ms;
  buf.style.setProperty('--p', ((ms - 10) / 190 * 100) + '%');  // заливка трека (webkit)
  if (started) nextTime = 0;  // мгновенно пересобрать буфер под новое значение
  if (save) lsSet('ss-buf', String(ms));
}
buf.addEventListener('input', () => setBuf(parseInt(buf.value, 10), true));
setBuf(bufMs, false);  // инициализация подписи и положения ползунка

// ---- Живой эквалайзер: рисуем реальный спектр из AnalyserNode ----

// Подгоняем канвас под размер на экране и плотность пикселей.
function sizeViz() {
  const dpr = window.devicePixelRatio || 1;
  const w = viz.clientWidth, h = viz.clientHeight;
  if (!w || !h) return;
  viz.width = Math.round(w * dpr);
  viz.height = Math.round(h * dpr);
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!started) drawViz(null);
}

// Столбик -> диапазон FFT-бинов по логарифмической шкале (50 Гц–15 кГц):
// так басы не съедают всю картинку, а верхам достаётся место.
function buildBarMap(sr, bins) {
  const ny = sr / 2;
  const fmin = 50, fmax = Math.min(15000, ny);
  barMap = [];
  for (let i = 0; i < VIZ_BARS; i++) {
    const f0 = fmin * Math.pow(fmax / fmin, i / VIZ_BARS);
    const f1 = fmin * Math.pow(fmax / fmin, (i + 1) / VIZ_BARS);
    let b0 = Math.floor(f0 / ny * bins), b1 = Math.ceil(f1 / ny * bins);
    b0 = Math.max(0, Math.min(bins - 1, b0));
    b1 = Math.max(b0 + 1, Math.min(bins, b1));
    barMap.push([b0, b1]);
  }
}

// data — байты спектра; null — «спящее» состояние (серые заглушки).
function drawViz(data) {
  const w = viz.clientWidth, h = viz.clientHeight;
  if (!w || !h) return;
  vctx.clearRect(0, 0, w, h);
  const gap = 5;
  const bw = (w - gap * (VIZ_BARS - 1)) / VIZ_BARS;
  const stub = 4, r = Math.min(3, bw / 2);
  vctx.fillStyle = data ? '#30d158' : '#2c2c2e';
  for (let i = 0; i < VIZ_BARS; i++) {
    let v = 0;
    if (data && barMap) {
      const [b0, b1] = barMap[i];
      let s = 0;
      for (let b = b0; b < b1; b++) s += data[b];
      v = Math.min(1, s / (b1 - b0) / 255 * 1.25);
      v = Math.pow(v, 1.35);  // лёгкая кривая — живее реагирует на музыку
    }
    const bh = stub + v * (h - stub);
    const x = i * (bw + gap), y = h - bh;
    vctx.beginPath();
    if (vctx.roundRect) vctx.roundRect(x, y, bw, bh, r);
    else vctx.rect(x, y, bw, bh);
    vctx.fill();
  }
}

function startViz() {
  cancelAnimationFrame(vizRaf);
  if (!analyser) return;
  const data = new Uint8Array(analyser.frequencyBinCount);
  const loop = () => {
    if (!started || !analyser) return;
    analyser.getByteFrequencyData(data);
    drawViz(data);
    vizRaf = requestAnimationFrame(loop);
  };
  loop();
}

window.addEventListener('resize', sizeViz);
sizeViz();

// При возврате из фона/разблокировке: будим контекст, перезапускаем <audio>
// и эквалайзер, прыгаем к живому краю (за время паузы поток ушёл вперёд).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !started || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  audioEl.play().catch(() => {});
  nextTime = 0;
  startViz();
});

connect();
</script>
</body>
</html>
