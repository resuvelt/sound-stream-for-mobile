<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0f1c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Звук ПК" />
<title>Sound Stream — Слушать</title>
<style>
  :root {
    color-scheme: dark;
    --text: #e6edf7;
    --muted: #94a3b8;
    --faint: #6b7a90;
    --accent: #22c55e;
    --accent-2: #10b981;
    --danger: #ef4444;
    --panel: rgba(9, 14, 26, .55);
    --hair: rgba(148, 163, 184, .14);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text); padding: 20px; -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(900px 620px at 12% -8%, rgba(34,197,94,.10), transparent 60%),
      radial-gradient(820px 620px at 112% 8%, rgba(99,102,241,.18), transparent 55%),
      linear-gradient(180deg, #0e1626, #0a0f1c 62%);
  }
  .card {
    position: relative; width: 100%; max-width: 400px; padding: 28px 26px 22px;
    text-align: center; border-radius: 24px;
    background: rgba(23, 32, 53, .68); border: 1px solid var(--hair);
    box-shadow: 0 30px 80px -22px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
    -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  }

  .head { display: flex; align-items: center; gap: 12px; text-align: left; margin-bottom: 24px; }
  .logo {
    width: 44px; height: 44px; flex: none; border-radius: 13px; display: grid; place-items: center;
    font-size: 22px; border: 1px solid rgba(34,197,94,.35);
    background: linear-gradient(145deg, rgba(34,197,94,.25), rgba(16,185,129,.10));
    box-shadow: 0 8px 22px -8px rgba(34,197,94,.6);
  }
  .head h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .head .sub { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }

  .stage { position: relative; display: grid; place-items: center; padding: 12px 0 20px; }
  .play {
    position: relative; z-index: 1; width: 132px; height: 132px; border-radius: 50%;
    border: 0; cursor: pointer; display: grid; place-items: center; color: #eafff2;
    background: radial-gradient(120% 120% at 30% 24%, #34d27d, #16a34a 62%, #0f8a3d);
    box-shadow: 0 18px 42px -10px rgba(16,163,74,.65), inset 0 2px 6px rgba(255,255,255,.4),
                inset 0 -10px 20px rgba(0,0,0,.28);
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  .play:hover { transform: translateY(-1px) scale(1.03); }
  .play:active { transform: scale(.97); }
  .play svg { width: 48px; height: 48px; fill: currentColor; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .play .i-pause { display: none; }
  .play.playing {
    color: #fff;
    background: radial-gradient(120% 120% at 30% 24%, #fb7185, #ef4444 62%, #dc2626);
    box-shadow: 0 18px 42px -10px rgba(239,68,68,.6), inset 0 2px 6px rgba(255,255,255,.35),
                inset 0 -10px 20px rgba(0,0,0,.28);
  }
  .play.playing .i-play { display: none; }
  .play.playing .i-pause { display: block; }
  .play:disabled {
    color: #64748b; cursor: not-allowed; transform: none;
    background: #25344e; box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  .play:disabled svg { filter: none; }
  /* пульсирующие кольца во время эфира */
  .play::before, .play::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.4); opacity: 0; pointer-events: none;
  }
  .play.playing::before { animation: ripple 2.4s ease-out infinite; }
  .play.playing::after  { animation: ripple 2.4s ease-out infinite 1.2s; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.7); opacity: 0; } }

  .status {
    display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px; border-radius: 999px;
    font-size: 13.5px; background: var(--panel); border: 1px solid var(--hair);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #64748b; flex: none; }
  .dot.live { background: var(--accent); animation: pulse 1.6s infinite; }
  .dot.err { background: var(--danger); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
    70% { box-shadow: 0 0 0 7px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }

  .lat { margin-top: 14px; font-size: 12.5px; color: var(--muted); min-height: 16px;
         font-variant-numeric: tabular-nums; }

  .control {
    margin-top: 18px; padding: 13px 15px 11px; border-radius: 16px;
    background: var(--panel); border: 1px solid var(--hair);
  }
  .ctl-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .ctl-head .lbl { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }
  .bufval { font-size: 15px; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }
  .ctl-scale { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10.5px; color: var(--faint); }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px;
                      background: transparent; cursor: pointer; --p: 0%; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)) no-repeat,
                rgba(148,163,184,.22);
    background-size: var(--p) 100%, 100% 100%;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin-top: -7px;
    border-radius: 50%; background: #fff; border: 2px solid var(--accent);
    box-shadow: 0 2px 8px rgba(0,0,0,.45), 0 0 0 4px rgba(34,197,94,.18);
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 999px; background: rgba(148,163,184,.22); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 2px solid var(--accent);
    border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.45); }

  .hint { margin: 16px 4px 2px; font-size: 12px; color: var(--faint); line-height: 1.5; }
  #sink { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .play.playing::before, .play.playing::after, .dot.live { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="card">
    <header class="head">
      <div class="logo">🔊</div>
      <div>
        <h1>Звук с ПК</h1>
        <p class="sub">Прямой эфир по локальной сети</p>
      </div>
    </header>

    <div class="stage">
      <button id="play" class="play" disabled aria-label="Воспроизвести">
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="5" width="4" height="14" rx="1.2"/>
          <rect x="14" y="5" width="4" height="14" rx="1.2"/>
        </svg>
      </button>
    </div>

    <!-- Скрытый <audio> — настоящая медиа-дорожка. Через него iOS продолжает
         играть звук в фоне и с выключенным экраном. -->
    <audio id="sink" playsinline></audio>

    <div class="status">
      <span id="dot" class="dot"></span>
      <span id="statusText">Подключение…</span>
    </div>

    <div class="lat" id="lat">Задержка: — мс</div>

    <div class="control">
      <div class="ctl-head">
        <span class="lbl">Буфер</span>
        <span id="bufVal" class="bufval">10 мс</span>
      </div>
      <input id="buf" type="range" min="10" max="200" step="5" value="10" />
      <div class="ctl-scale"><span>меньше задержка</span><span>стабильнее</span></div>
    </div>

    <p class="hint">Можно гасить экран и сворачивать браузер — звук продолжит играть.</p>
  </div>

<script>
const playBtn = document.getElementById('play');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const audioEl = document.getElementById('sink');
const latEl = document.getElementById('lat');
const buf = document.getElementById('buf');
const bufVal = document.getElementById('bufVal');

let ws = null;
let audioCtx = null;
let gainNode = null;
let streamDest = null;     // MediaStreamAudioDestinationNode -> <audio>
let streamLive = false;
let started = false;

let latencyMs = 0;         // сглаженная локальная задержка (буфер + выход)
let latTimer = null;       // таймер обновления индикатора

let sampleRate = 48000;   // обновляется из format-сообщения источника
let nextTime = 0;         // момент (в часах audioCtx) для следующего кусочка

// Целевой буфер вперёд живого края, мс. Меньше — ниже задержка, но при неровной
// сети возможны заикания. Из него выводим окно коррекции скоростью (hi/lo вокруг
// цели) и аварийный порог отставания (max — прыжок к живому краю).
function cfgFromBuf(ms) {
  const j = ms / 1000;
  return { jitter: j, hi: j * 0.9, lo: j * 0.5, max: j * 3 + 0.05 };
}
// Safari в приватном режиме бросает исключение на localStorage — оборачиваем.
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let bufMs = parseInt(lsGet('ss-buf'), 10);
if (!bufMs) {  // миграция со старых пресетов или значение по умолчанию
  const old = lsGet('ss-mode');
  bufMs = old === 'stable' ? 120 : old === 'balanced' ? 60 : 10;
}
bufMs = Math.min(200, Math.max(10, bufMs));
let cfg = cfgFromBuf(bufMs);

function setStatus(text, cls) {
  statusText.textContent = text;
  dot.className = 'dot' + (cls ? ' ' + cls : '');
}

function wsURL() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return `${proto}//${location.host}/?role=listener`;
}

function connect() {
  ws = new WebSocket(wsURL());
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => setStatus('Подключено. Ожидание эфира…');

  ws.onmessage = (ev) => {
    if (typeof ev.data === 'string') {
      try {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'format') sampleRate = msg.sampleRate || sampleRate;
        if (msg.type === 'live') { streamLive = true; onLive(); }
        if (msg.type === 'offline') { streamLive = false; onOffline(); }
      } catch {}
      return;
    }
    if (started && audioCtx) schedulePCM(ev.data);
  };

  ws.onclose = () => {
    setStatus('Соединение потеряно. Переподключение…', 'err');
    if (!started) playBtn.disabled = true;
    setTimeout(connect, 1500);
  };
  ws.onerror = () => setStatus('Ошибка соединения', 'err');
}

function onLive() {
  setStatus(started ? 'Воспроизведение' : 'Эфир идёт — нажми ▶', 'live');
  if (!started) playBtn.disabled = false;
}

function onOffline() {
  setStatus('ПК не в эфире', 'err');
  if (!started) playBtn.disabled = true;
}

function startPlayback() {
  if (started) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 1;   // громкость регулируется кнопками телефона

  // Ключевой момент для фона/выключенного экрана на iOS:
  // не выводим звук напрямую в audioCtx.destination, а гоним его в MediaStream
  // и воспроизводим через обычный <audio>. Для системы это «медиа-дорожка»,
  // поэтому AudioContext не глушится в фоне и появляются контролы на локскрине.
  streamDest = audioCtx.createMediaStreamDestination();
  gainNode.connect(streamDest);
  audioEl.srcObject = streamDest.stream;

  audioCtx.resume();           // обязательно по жесту пользователя (особенно iOS)
  const p = audioEl.play();    // тоже по жесту — иначе iOS не отдаст фон
  if (p && p.catch) p.catch(() => {});

  setupMediaSession();

  nextTime = 0;
  started = true;
  startLatencyReadout();
  playBtn.classList.add('playing');
  playBtn.setAttribute('aria-label', 'Остановить');
  setStatus(streamLive ? 'Воспроизведение' : 'Ожидание эфира…', streamLive ? 'live' : '');
}

// Периодически выводим сглаженную задержку в мс, пока идёт воспроизведение.
function startLatencyReadout() {
  latencyMs = 0;
  latEl.textContent = 'Задержка: измеряю…';
  clearInterval(latTimer);
  latTimer = setInterval(() => {
    if (started && latencyMs) latEl.textContent = 'Задержка: ~' + Math.round(latencyMs) + ' мс';
  }, 300);
}

function stopLatencyReadout() {
  clearInterval(latTimer);
  latTimer = null;
  latencyMs = 0;
  latEl.textContent = 'Задержка: — мс';
}

// Метаданные и контролы для экрана блокировки / шторки уведомлений.
function setupMediaSession() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'Звук ПК',
      artist: 'Sound Stream',
      artwork: [{ src: artworkURL(), sizes: '256x256', type: 'image/png' }]
    });
    navigator.mediaSession.playbackState = 'playing';
    navigator.mediaSession.setActionHandler('play', () => {
      if (!started) startPlayback();
      audioEl.play().catch(() => {});
      navigator.mediaSession.playbackState = 'playing';
    });
    navigator.mediaSession.setActionHandler('pause', stopPlayback);
    navigator.mediaSession.setActionHandler('stop', stopPlayback);
  } catch (e) {}
}

// Простая обложка для локскрина (рисуем на лету, без внешних файлов).
let _artwork = null;
function artworkURL() {
  if (_artwork) return _artwork;
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#0f172a'; x.fillRect(0, 0, 256, 256);
  x.font = '150px serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('🔊', 128, 140);
  return (_artwork = c.toDataURL('image/png'));
}

// Int16 PCM (моно) -> запланированное воспроизведение через Web Audio.
function schedulePCM(arrayBuffer) {
  const i16 = new Int16Array(arrayBuffer);
  const n = i16.length;
  if (n === 0) return;
  const buffer = audioCtx.createBuffer(1, n, sampleRate);
  const f32 = buffer.getChannelData(0);
  for (let i = 0; i < n; i++) f32[i] = i16[i] / 0x8000;

  const now = audioCtx.currentTime;
  // Старт/недобор буфера или авария (слишком большое отставание) — задаём запас.
  if (nextTime < now + 0.005 || nextTime - now > cfg.max) nextTime = now + cfg.jitter;

  // Плавная коррекция задержки скоростью (±%, на слух почти незаметно):
  // отстаём от живого края — чуть ускоряемся, подобрались слишком близко — тормозим.
  const lead = nextTime - now;
  let rate = 1;
  if (lead > cfg.jitter + cfg.hi) rate = 1.02;
  else if (lead < cfg.jitter - cfg.lo) rate = 0.99;

  // Локальная задержка = буфер впереди живого края + задержка вывода устройства.
  // Сетевую часть (ПК→сервер→сюда) без синхронизации часов не измерить.
  const out = audioCtx.outputLatency || audioCtx.baseLatency || 0;
  const inst = (lead + out) * 1000;
  latencyMs = latencyMs ? latencyMs * 0.9 + inst * 0.1 : inst;

  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  src.playbackRate.value = rate;
  src.connect(gainNode);
  src.start(nextTime);
  nextTime += buffer.duration / rate; // реальная длительность с учётом скорости
}

function stopPlayback() {
  started = false;
  stopLatencyReadout();
  playBtn.classList.remove('playing');
  playBtn.setAttribute('aria-label', 'Воспроизвести');
  if (audioEl) { audioEl.pause(); audioEl.srcObject = null; }
  if (audioCtx) audioCtx.close().catch(() => {});
  audioCtx = null;
  gainNode = null;
  streamDest = null;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
  setStatus(streamLive ? 'Эфир идёт — нажми ▶' : 'ПК не в эфире', streamLive ? 'live' : 'err');
}

playBtn.addEventListener('click', () => {
  if (started) stopPlayback(); else startPlayback();
});

// Применяем целевой буфер на лету и запоминаем число.
function setBuf(ms, save) {
  bufMs = ms;
  cfg = cfgFromBuf(ms);
  bufVal.textContent = ms + ' мс';
  buf.value = ms;
  buf.style.setProperty('--p', ((ms - 10) / 190 * 100) + '%');  // заливка трека (webkit)
  if (started) nextTime = 0;  // мгновенно пересобрать буфер под новое значение
  if (save) lsSet('ss-buf', String(ms));
}
buf.addEventListener('input', () => setBuf(parseInt(buf.value, 10), true));
setBuf(bufMs, false);  // инициализация подписи и положения ползунка

// При возврате из фона/разблокировке: будим контекст, перезапускаем <audio>
// и прыгаем к живому краю (за время паузы поток ушёл вперёд).
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !started || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  audioEl.play().catch(() => {});
  nextTime = 0;
});

connect();
</script>
</body>
</html>
